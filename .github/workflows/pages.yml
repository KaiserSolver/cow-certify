name: Deploy web app to GitHub Pages

# Publishes the client-side certifier (web/) to GitHub Pages so anyone can
# verify a settlement in their browser at
# https://<owner>.github.io/cow-certify/ — no backend, always on.
# One-time setup after this lands: repo Settings → Pages → Source = "GitHub
# Actions" (then this workflow deploys automatically).
#
# The deploy is gated on the browser engine's offline tests: a JS-only verdict
# regression must not auto-publish.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/fixtures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: only what the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser engine offline guards
        run: |
          node web/test_decode.mjs
          TRUTH=./testdata/parity_decode_truth.json node web/test_decode.mjs
          node web/test_hermetic.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Upload only the app directory as the site root, so the app lives at the
      # Pages root (…/cow-certify/) rather than …/cow-certify/web/. The static
      # artifact is served as-is (no Jekyll), so the ES-module relative imports
      # and inlined font work unchanged.
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
