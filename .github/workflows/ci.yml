name: CI

# The tests and drift guards existed before this workflow — but nothing
# ENFORCED them on merge, so the README's "two guards force it" promise was
# stronger than the automation (2026-08-17 audit). This makes every push and
# PR run: Python unit tests, the Python/JS decoder parity vectors, and a
# compile check of both engines. The LIVE parity guard (test_certify.mjs
# against fresh RPCs) is deliberately excluded from the merge gate — external
# endpoints are nondeterministic; run it on demand or nightly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install eth-abi pytest
      - name: Python engine compiles
        run: python -m compileall cow_certify
      - name: Python unit tests
        run: python -m pytest tests/ -q
      - name: Decoder parity vectors (Python vs JS, frozen corpus)
        run: node web/test_decode.mjs
